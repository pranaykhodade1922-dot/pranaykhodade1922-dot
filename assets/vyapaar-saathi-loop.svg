<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="vs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="vs-shadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <style>
      .font-mono { font-family: 'SF Pro Mono', 'JetBrains Mono', Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }

      @keyframes node-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes arrow-flow {
        from { stroke-dashoffset: 16; }
        to { stroke-dashoffset: 0; }
      }

      .step-node { animation: node-bounce 3s ease-in-out infinite; }
      .dashed-flow { stroke-dasharray: 4, 4; animation: arrow-flow 1.5s linear infinite; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="876" height="136" rx="14" fill="url(#vs-bg)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#vs-shadow)" />

  <!-- Title & Hackathon Pill -->
  <g transform="translate(24, 22)">
    <circle cx="4" cy="4" r="3.5" fill="#0284C7" />
    <text x="14" y="8" fill="#0F172A" font-size="11.5" font-weight="700" letter-spacing="0.8" class="font-mono">VYAPAAR SAATHI // 7-STAGE DECISION-ACTION PIPELINE</text>
    <text x="630" y="8" fill="#0284C7" font-size="10.5" font-weight="600" class="font-mono">PAYTM BUILD FOR INDIA AI</text>
  </g>

  <!-- Background Connector Flow -->
  <line x1="60" y1="74" x2="820" y2="74" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="60" y1="74" x2="820" y2="74" stroke="#0284C7" stroke-width="1.5" class="dashed-flow" opacity="0.4" />

  <!-- STEP 1: OBSERVE -->
  <g transform="translate(26, 48)" class="step-node">
    <rect width="98" height="52" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#0284C7" />
    <text x="16" y="19" fill="#FFFFFF" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">1</text>
    <text x="28" y="19" fill="#0284C7" font-size="10.5" font-weight="700" class="font-mono">OBSERVE</text>
    <text x="12" y="38" fill="#64748B" font-size="9" class="font-sans">Voice / Ledger</text>
  </g>

  <!-- STEP 2: REASON -->
  <g transform="translate(148, 48)" class="step-node" style="animation-delay: 0.25s;">
    <rect width="98" height="52" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#2563EB" />
    <text x="16" y="19" fill="#FFFFFF" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">2</text>
    <text x="28" y="19" fill="#2563EB" font-size="10.5" font-weight="700" class="font-mono">REASON</text>
    <text x="12" y="38" fill="#64748B" font-size="9" class="font-sans">Context &amp; Risk</text>
  </g>

  <!-- STEP 3: PROPOSE -->
  <g transform="translate(270, 48)" class="step-node" style="animation-delay: 0.5s;">
    <rect width="98" height="52" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#4F46E5" />
    <text x="16" y="19" fill="#FFFFFF" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">3</text>
    <text x="28" y="19" fill="#4F46E5" font-size="10.5" font-weight="700" class="font-mono">PROPOSE</text>
    <text x="12" y="38" fill="#64748B" font-size="9" class="font-sans">Draft Plan</text>
  </g>

  <!-- STEP 4: APPROVE (HUMAN CHECKPOINT) -->
  <g transform="translate(392, 42)" class="step-node" style="animation-delay: 0.75s;">
    <rect width="108" height="64" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" />
    <rect width="76" height="13" rx="4" x="16" y="-6" fill="#D97706" />
    <text x="54" y="3" fill="#FFFFFF" font-size="7.5" font-weight="800" text-anchor="middle" class="font-mono">HUMAN-IN-LOOP</text>
    <circle cx="18" cy="20" r="5" fill="#D97706" />
    <text x="18" y="23" fill="#FFFFFF" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">4</text>
    <text x="30" y="23" fill="#B45309" font-size="10.5" font-weight="800" class="font-mono">APPROVE</text>
    <text x="12" y="42" fill="#92400E" font-size="9" font-weight="600" class="font-sans">Merchant Check</text>
    <text x="12" y="54" fill="#B45309" font-size="8" class="font-mono">Zero Silent Actions</text>
  </g>

  <!-- STEP 5: ACT -->
  <g transform="translate(524, 48)" class="step-node" style="animation-delay: 1s;">
    <rect width="98" height="52" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#059669" />
    <text x="16" y="19" fill="#FFFFFF" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">5</text>
    <text x="28" y="19" fill="#059669" font-size="10.5" font-weight="700" class="font-mono">ACT</text>
    <text x="12" y="38" fill="#64748B" font-size="9" class="font-sans">Execute Action</text>
  </g>

  <!-- STEP 6: VERIFY -->
  <g transform="translate(646, 48)" class="step-node" style="animation-delay: 1.25s;">
    <rect width="98" height="52" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#0D9488" />
    <text x="16" y="19" fill="#FFFFFF" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">6</text>
    <text x="28" y="19" fill="#0D9488" font-size="10.5" font-weight="700" class="font-mono">VERIFY</text>
    <text x="12" y="38" fill="#64748B" font-size="9" class="font-sans">Integer Paise Math</text>
  </g>

  <!-- STEP 7: REMEMBER -->
  <g transform="translate(768, 48)" class="step-node" style="animation-delay: 1.5s;">
    <rect width="96" height="52" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#7C3AED" />
    <text x="16" y="19" fill="#FFFFFF" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">7</text>
    <text x="28" y="19" fill="#7C3AED" font-size="9.5" font-weight="700" class="font-mono">REMEMBER</text>
    <text x="12" y="38" fill="#64748B" font-size="9" class="font-sans">Ledger Memory</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(24, 124)">
    <text x="0" y="0" fill="#94A3B8" font-size="9" class="font-mono">
      DETERMINISTIC INTEGER MATH (ZERO FLOATING-POINT DRIFT) • EXPLICIT HUMAN CONFIRMATION BEFORE MUTATION
    </text>
  </g>
</svg>
