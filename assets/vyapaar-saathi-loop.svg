<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="vs-static-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C18" />
      <stop offset="100%" stop-color="#0E1628" />
    </linearGradient>
    <style>
      .font-mono { font-family: 'Consolas', 'JetBrains Mono', 'SF Pro Mono', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="860" height="180" rx="10" fill="url(#vs-static-bg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(24, 22)">
    <circle cx="4" cy="4" r="3.5" fill="#00F0FF" />
    <text x="14" y="8" fill="#F1F5F9" font-size="11.5" font-weight="700" letter-spacing="0.8" class="font-mono">VYAPAAR SAATHI // AGENTIC DECISION-ACTION LOOP</text>
    <text x="540" y="8" fill="#38BDF8" font-size="10.5" font-weight="600" class="font-mono">PAYTM BUILD FOR INDIA AI HACKATHON</text>
  </g>

  <!-- Track -->
  <line x1="50" y1="85" x2="810" y2="85" stroke="#1E293B" stroke-width="2" />
  <line x1="50" y1="85" x2="810" y2="85" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />

  <!-- 1. OBSERVE -->
  <g transform="translate(24, 56)">
    <rect width="104" height="58" rx="8" fill="#0F172A" stroke="#00F0FF" stroke-width="1.2" />
    <circle cx="15" cy="18" r="6" fill="#00F0FF" />
    <text x="15" y="21" fill="#0A0F1D" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">1</text>
    <text x="28" y="22" fill="#00F0FF" font-size="11" font-weight="700" class="font-mono">OBSERVE</text>
    <text x="10" y="44" fill="#94A3B8" font-size="9" class="font-sans">Voice / Ledger</text>
  </g>

  <!-- 2. REASON -->
  <g transform="translate(142, 56)">
    <rect width="104" height="58" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="15" cy="18" r="6" fill="#38BDF8" />
    <text x="15" y="21" fill="#0A0F1D" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">2</text>
    <text x="28" y="22" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono">REASON</text>
    <text x="10" y="44" fill="#94A3B8" font-size="9" class="font-sans">Context &amp; Risk</text>
  </g>

  <!-- 3. PROPOSE -->
  <g transform="translate(260, 56)">
    <rect width="104" height="58" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.2" />
    <circle cx="15" cy="18" r="6" fill="#818CF8" />
    <text x="15" y="21" fill="#0A0F1D" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">3</text>
    <text x="28" y="22" fill="#818CF8" font-size="11" font-weight="700" class="font-mono">PROPOSE</text>
    <text x="10" y="44" fill="#94A3B8" font-size="9" class="font-sans">Draft Plan</text>
  </g>

  <!-- 4. APPROVE (HUMAN CHECK) -->
  <g transform="translate(378, 50)">
    <rect width="108" height="68" rx="8" fill="#2D1A0A" stroke="#F59E0B" stroke-width="1.8" />
    <rect width="78" height="14" rx="4" x="15" y="-7" fill="#F59E0B" />
    <text x="54" y="3" fill="#0A0F1D" font-size="7.5" font-weight="800" text-anchor="middle" class="font-mono">HUMAN CHECK</text>
    <circle cx="15" cy="22" r="6" fill="#F59E0B" />
    <text x="15" y="25" fill="#0A0F1D" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">4</text>
    <text x="28" y="25" fill="#FBBF24" font-size="11" font-weight="800" class="font-mono">APPROVE</text>
    <text x="10" y="46" fill="#FEF3C7" font-size="9" font-weight="600" class="font-sans">Merchant Check</text>
    <text x="10" y="58" fill="#F59E0B" font-size="8" class="font-mono">Zero Silent Act</text>
  </g>

  <!-- 5. ACT -->
  <g transform="translate(498, 56)">
    <rect width="104" height="58" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2" />
    <circle cx="15" cy="18" r="6" fill="#10B981" />
    <text x="15" y="21" fill="#0A0F1D" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">5</text>
    <text x="28" y="22" fill="#10B981" font-size="11" font-weight="700" class="font-mono">ACT</text>
    <text x="10" y="44" fill="#94A3B8" font-size="9" class="font-sans">Execute Action</text>
  </g>

  <!-- 6. VERIFY -->
  <g transform="translate(616, 56)">
    <rect width="104" height="58" rx="8" fill="#0F172A" stroke="#34D399" stroke-width="1.2" />
    <circle cx="15" cy="18" r="6" fill="#34D399" />
    <text x="15" y="21" fill="#0A0F1D" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">6</text>
    <text x="28" y="22" fill="#34D399" font-size="11" font-weight="700" class="font-mono">VERIFY</text>
    <text x="10" y="44" fill="#94A3B8" font-size="9" class="font-sans">Integer Paise Math</text>
  </g>

  <!-- 7. REMEMBER -->
  <g transform="translate(734, 56)">
    <rect width="104" height="58" rx="8" fill="#0F172A" stroke="#C084FC" stroke-width="1.2" />
    <circle cx="15" cy="18" r="6" fill="#C084FC" />
    <text x="15" y="21" fill="#0A0F1D" font-size="8.5" font-weight="800" text-anchor="middle" class="font-mono">7</text>
    <text x="28" y="22" fill="#C084FC" font-size="10.5" font-weight="700" class="font-mono">REMEMBER</text>
    <text x="10" y="44" fill="#94A3B8" font-size="9" class="font-sans">Ledger Memory</text>
  </g>

  <!-- Footer -->
  <g transform="translate(24, 158)">
    <text x="0" y="0" fill="#64748B" font-size="9.5" class="font-mono">
      PRINCIPLES: Deterministic integer mathematics (zero floating-point drift) • Explicit merchant sign-off before state mutation
    </text>
  </g>
</svg>
