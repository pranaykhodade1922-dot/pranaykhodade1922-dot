<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 190" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="tech-dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C18" />
      <stop offset="100%" stop-color="#0E1628" />
    </linearGradient>
    <style>
      .font-mono { font-family: 'Consolas', 'JetBrains Mono', 'SF Pro Mono', monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="860" height="190" rx="10" fill="url(#tech-dark-bg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(24, 22)">
    <circle cx="4" cy="4" r="3.5" fill="#00F0FF" />
    <text x="14" y="8" fill="#F1F5F9" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">DEVELOPER TOOLKIT // VERIFIED PRODUCTION STACK</text>
    <text x="580" y="8" fill="#38BDF8" font-size="10.5" font-weight="600" class="font-mono">SYS.STATUS: OPERATIONAL</text>
  </g>

  <!-- Categories -->
  <!-- 1. Languages -->
  <g transform="translate(22, 44)">
    <rect width="196" height="130" rx="8" fill="#0B1120" stroke="#00F0FF" stroke-width="1.2" />
    <text x="12" y="22" fill="#00F0FF" font-size="11" font-weight="700" class="font-mono">LANGUAGES</text>
    <g transform="translate(10, 36)">
      <!-- C++ -->
      <rect width="82" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="12" cy="17" r="4" fill="#00599C" />
      <text x="24" y="21" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">C++</text>
      <!-- Python -->
      <rect x="88" width="86" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="100" cy="17" r="4" fill="#3776AB" />
      <text x="112" y="21" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">Python</text>
      <!-- TypeScript -->
      <rect y="42" width="82" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="12" cy="59" r="4" fill="#3178C6" />
      <text x="24" y="63" fill="#F1F5F9" font-size="10" font-weight="600" class="font-sans">TS</text>
      <!-- JavaScript -->
      <rect x="88" y="42" width="86" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="100" cy="59" r="4" fill="#F7DF1E" />
      <text x="112" y="63" fill="#F1F5F9" font-size="10" font-weight="600" class="font-sans">JS</text>
    </g>
  </g>

  <!-- 2. Frontend -->
  <g transform="translate(228, 44)">
    <rect width="196" height="130" rx="8" fill="#0B1120" stroke="#38BDF8" stroke-width="1.2" />
    <text x="12" y="22" fill="#38BDF8" font-size="11" font-weight="700" class="font-mono">FRONTEND</text>
    <g transform="translate(10, 36)">
      <!-- React -->
      <rect width="82" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="12" cy="17" r="4" fill="#61DAFB" />
      <text x="24" y="21" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">React</text>
      <!-- Tailwind -->
      <rect x="88" width="86" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="100" cy="17" r="4" fill="#06B6D4" />
      <text x="112" y="21" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">Tailwind</text>
      <!-- HTML5 -->
      <rect y="42" width="82" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="12" cy="59" r="4" fill="#E34F26" />
      <text x="24" y="63" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">HTML5</text>
      <!-- CSS3 -->
      <rect x="88" y="42" width="86" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="100" cy="59" r="4" fill="#1572B6" />
      <text x="112" y="63" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">CSS3</text>
    </g>
  </g>

  <!-- 3. Backend & Data -->
  <g transform="translate(434, 44)">
    <rect width="196" height="130" rx="8" fill="#0B1120" stroke="#A855F7" stroke-width="1.2" />
    <text x="12" y="22" fill="#A855F7" font-size="11" font-weight="700" class="font-mono">BACKEND &amp; DATA</text>
    <g transform="translate(10, 36)">
      <!-- Node.js -->
      <rect width="82" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="12" cy="17" r="4" fill="#339933" />
      <text x="24" y="21" fill="#F1F5F9" font-size="10" font-weight="600" class="font-sans">Node.js</text>
      <!-- PostgreSQL -->
      <rect x="88" width="86" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="100" cy="17" r="4" fill="#4169E1" />
      <text x="112" y="21" fill="#F1F5F9" font-size="10" font-weight="600" class="font-sans">Postgres</text>
      <!-- Supabase -->
      <rect y="42" width="82" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="12" cy="59" r="4" fill="#3ECF8E" />
      <text x="24" y="63" fill="#F1F5F9" font-size="9.5" font-weight="600" class="font-sans">Supabase</text>
      <!-- Firebase -->
      <rect x="88" y="42" width="86" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="100" cy="59" r="4" fill="#FFCA28" />
      <text x="112" y="63" fill="#F1F5F9" font-size="9.5" font-weight="600" class="font-sans">Firebase</text>
    </g>
  </g>

  <!-- 4. Developer Tools -->
  <g transform="translate(640, 44)">
    <rect width="196" height="130" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="1.2" />
    <text x="12" y="22" fill="#10B981" font-size="11" font-weight="700" class="font-mono">DEV TOOLS</text>
    <g transform="translate(10, 36)">
      <!-- Git -->
      <rect width="82" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="12" cy="17" r="4" fill="#F05032" />
      <text x="24" y="21" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">Git</text>
      <!-- GitHub -->
      <rect x="88" width="86" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="100" cy="17" r="4" fill="#FFFFFF" />
      <text x="112" y="21" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">GitHub</text>
      <!-- Figma -->
      <rect y="42" width="82" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="12" cy="59" r="4" fill="#F24E1E" />
      <text x="24" y="63" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">Figma</text>
      <!-- Vercel -->
      <rect x="88" y="42" width="86" height="34" rx="4" fill="#0F172A" stroke="#1E293B" />
      <circle cx="100" cy="59" r="4" fill="#00F0FF" />
      <text x="112" y="63" fill="#F1F5F9" font-size="10.5" font-weight="600" class="font-sans">Vercel</text>
    </g>
  </g>
</svg>
