<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 4" width="100%" height="4" fill="none">
  <defs>
    <linearGradient id="div-dark-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0" />
      <stop offset="15%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="div-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="1" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes beam-sweep {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(1000px); }
      }
      .beam-runner { animation: beam-sweep 4s linear infinite; }
    </style>
  </defs>

  <!-- Base line -->
  <rect x="0" y="1" width="860" height="1.5" fill="url(#div-dark-base)" />

  <!-- Animated beam -->
  <g clip-path="url(#beam-clip)">
    <clipPath id="beam-clip">
      <rect x="0" y="0" width="860" height="4" rx="2" />
    </clipPath>
    <rect x="-300" y="0.5" width="280" height="2.5" fill="url(#div-beam)" class="beam-runner" rx="1.2" />
  </g>
</svg>
