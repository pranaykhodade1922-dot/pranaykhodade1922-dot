<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 4" width="100%" height="4" fill="none">
  <defs>
    <linearGradient id="div-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0" />
      <stop offset="15%" stop-color="#E2E8F0" stop-opacity="1" />
      <stop offset="85%" stop-color="#E2E8F0" stop-opacity="1" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#8B5CF6" stop-opacity="1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes sweep {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(1100px); }
      }
      .beam-sweep {
        animation: sweep 4.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base hairline -->
  <rect x="0" y="1" width="960" height="1.5" fill="url(#div-base)" />

  <!-- Animated beam -->
  <g clip-path="url(#beam-clip)">
    <clipPath id="beam-clip">
      <rect x="0" y="0" width="960" height="4" rx="2" />
    </clipPath>
    <rect x="-300" y="0.5" width="280" height="2.5" fill="url(#beam)" class="beam-sweep" rx="1.2" />
  </g>
</svg>
