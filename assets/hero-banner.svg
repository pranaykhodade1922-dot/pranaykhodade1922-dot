<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glow-violet" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="85%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(148, 163, 184, 0.05)" stroke-width="1" />
    </pattern>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      
      @keyframes beam {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes float-grid {
        0% { transform: translate(0, 0); }
        50% { transform: translate(4px, 3px); }
        100% { transform: translate(0, 0); }
      }

      .status-dot {
        transform-origin: 145px 44px;
        animation: pulse-dot 2.5s infinite ease-in-out;
      }

      .cursor-blink {
        animation: blink 1s infinite;
      }

      .beam-line {
        animation: beam 4s infinite linear;
      }
    </style>
  </defs>

  <!-- Base Card Container -->
  <rect width="920" height="280" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Subtle Grid Background -->
  <rect width="920" height="280" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <rect width="920" height="280" rx="16" fill="url(#glow-violet)" />
  <rect width="920" height="280" rx="16" fill="url(#glow-cyan)" />

  <!-- Top Window Header Bar -->
  <g transform="translate(24, 22)">
    <!-- Window Control Dots -->
    <circle cx="10" cy="10" r="4.5" fill="#EF4444" opacity="0.85" />
    <circle cx="26" cy="10" r="4.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="42" cy="10" r="4.5" fill="#10B981" opacity="0.85" />
    
    <text x="64" y="14" fill="#64748B" font-size="12" font-weight="500" class="mono">pranay.dev // b.tech cse (data science) // full-stack &amp; ai builder</text>

    <!-- Status Indicator Pill -->
    <g transform="translate(580, -2)">
      <rect width="288" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="12" r="4" fill="#10B981" class="status-dot" />
      <text x="27" y="16" fill="#34D399" font-size="11" font-weight="600" class="mono">TURNING IDEAS INTO PRODUCTS</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="58" x2="896" y2="58" stroke="#1E293B" stroke-width="1" />

  <!-- Main Identity Content -->
  <g transform="translate(36, 96)">
    <!-- Sub-heading tag -->
    <text x="0" y="8" fill="#38BDF8" font-size="12.5" font-weight="700" letter-spacing="2" class="mono">PORTFOLIO &amp; ENGINEERING WORKSPACE</text>
    
    <!-- Hero Name -->
    <text x="0" y="56" fill="url(#name-grad)" font-size="44" font-weight="800" letter-spacing="-0.5" class="sans">Pranay Khodade</text>
    
    <!-- Dynamic Tagline -->
    <g transform="translate(0, 92)">
      <text x="0" y="0" fill="#E2E8F0" font-size="16.5" font-weight="500" class="sans">
        I don't just write code. <tspan fill="#38BDF8" font-weight="600">I turn ideas into things people can use.</tspan>
      </text>
      <rect x="582" y="-14" width="8" height="18" fill="#818CF8" class="cursor-blink" rx="1" />
    </g>

    <!-- Short description -->
    <text x="0" y="122" fill="#94A3B8" font-size="13.5" font-weight="400" class="sans">
      Full-Stack Developer • AI Product Builder • Hackathon Competitor • Open-Source Contributor
    </text>
  </g>

  <!-- Accent Capability Pills (Right side) -->
  <g transform="translate(640, 110)">
    <!-- Pill 1: Architecture -->
    <g transform="translate(0, 0)">
      <rect width="240" height="30" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="19" fill="#93C5FD" font-size="11.5" font-weight="600" class="mono">⚙ ARCHITECTURE</text>
      <text x="120" y="19" fill="#64748B" font-size="11" class="mono">Agentic &amp; Full-Stack</text>
    </g>
    <!-- Pill 2: Security -->
    <g transform="translate(0, 38)">
      <rect width="240" height="30" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="19" fill="#C084FC" font-size="11.5" font-weight="600" class="mono">🛡 DEFENSE</text>
      <text x="96" y="19" fill="#64748B" font-size="11" class="mono">Trust &amp; Verification</text>
    </g>
    <!-- Pill 3: Shipping -->
    <g transform="translate(0, 76)">
      <rect width="240" height="30" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="19" fill="#34D399" font-size="11.5" font-weight="600" class="mono">🚀 SHIPPED</text>
      <text x="94" y="19" fill="#64748B" font-size="11" class="mono">Voice, Web &amp; Mobile</text>
    </g>
  </g>

  <!-- Animated Bottom Border Light Beam -->
  <rect x="0" y="277" width="920" height="3" fill="#1E293B" />
  <g clip-path="url(#bottom-clip)">
    <clipPath id="bottom-clip">
      <rect x="0" y="277" width="920" height="3" rx="1.5" />
    </clipPath>
    <rect x="-300" y="277" width="300" height="3" fill="url(#accent-bar)" opacity="0.9" filter="url(#subtle-glow)">
      <animate attributeName="x" from="-300" to="920" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>

